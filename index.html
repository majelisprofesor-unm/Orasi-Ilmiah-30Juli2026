<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Orasi Ilmiah - Juli 2026 | UNM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --unm-gold: #C9A227;
      --unm-gold-dark: #9A7B1A;
      --unm-gold-light: #E8D48B;
      --bg-main: #2C2416;
      --sidebar-bg: #1F1A12;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #2C2416;
      display: flex;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f0e6d0;
      height: 100dvh;
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: 300px;
      min-width: 300px;
      background: var(--sidebar-bg);
      border-right: 2px solid var(--unm-gold-dark);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-header {
      padding: 16px;
      background: linear-gradient(145deg, #3A2F1C, #1F1A12);
      border-bottom: 2px solid var(--unm-gold-dark);
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.4;
      color: var(--unm-gold-light);
      flex-shrink: 0;
    }

    .book-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .book-item {
      padding: 11px 13px;
      margin-bottom: 7px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      background: rgba(201, 162, 39, 0.08);
    }

    .book-item:hover {
      background: rgba(201, 162, 39, 0.18);
      border-color: var(--unm-gold-dark);
    }

    .book-item.active {
      background: var(--unm-gold);
      border-color: var(--unm-gold-light);
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }

    .book-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--unm-gold-light);
      margin-bottom: 3px;
    }

    .book-title {
      font-size: 0.74rem;
      line-height: 1.3;
      color: #e8d9b0;
      opacity: 0.9;
    }

    .book-item.active .book-name,
    .book-item.active .book-title {
      color: #1F1A12;
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--unm-gold-dark);
      flex-shrink: 0;
    }

    .btn-home {
      width: 100%;
      padding: 11px 14px;
      background: rgba(201, 162, 39, 0.15);
      border: 1px solid var(--unm-gold-dark);
      border-radius: 9px;
      color: var(--unm-gold-light);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-home:hover {
      background: var(--unm-gold);
      color: #1F1A12;
    }

    /* ========== MAIN ========== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
    }

    .main-header {
      padding: 12px 20px;
      background: #1F1A12;
      border-bottom: 2px solid var(--unm-gold-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--unm-gold-light);
      flex-shrink: 0;
      gap: 10px;
    }

    .main-header h2 {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main-header span {
      font-size: 0.8rem;
      opacity: 0.75;
      white-space: nowrap;
    }

    #book-area {
      flex: 1;
      position: relative;
      min-height: 0;
      background: #1a1510;
    }

    /* Slideshow */
    .slideshow {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #1a1510;
    }

    .slideshow.hidden {
      display: none;
    }

    .slideshow img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.9s ease;
      background: #1a1510;
    }

    .slideshow img.active {
      opacity: 1;
      z-index: 1;
    }

    .dots {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 5;
    }

    .dots span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
    }

    .dots span.active {
      background: var(--unm-gold);
    }

    /* Flipbook container */
    #book {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;

      --fb-bg: transparent;
      --fb-paper: #fffaf0;
      --fb-control-bg: rgba(31, 26, 18, 0.9);
      --fb-control-fg: #E8D48B;
      --fb-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
    }

    /* ========== MOBILE ========== */
    @media (max-width: 768px) {
  body {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    min-width: 100%;
    height: auto;
    max-height: 32vh;          /* lebih rendah */
    border-right: none;
    border-bottom: 2px solid var(--unm-gold-dark);
  }

  .sidebar-header {
    padding: 8px 12px;
    font-size: 0.80rem;        /* lebih kecil */
    line-height: 1.3;
  }

  .book-list {
    padding: 6px 8px;
  }

  .book-item {
    padding: 7px 10px;
    margin-bottom: 4px;
    border-radius: 7px;
  }

  .book-name {
    font-size: 0.72rem;        /* lebih kecil */
    margin-bottom: 2px;
  }

  .book-title {
    font-size: 0.65rem;        /* lebih kecil */
    line-height: 1.25;
  }

  .sidebar-footer {
    padding: 6px 8px;
  }

  .btn-home {
    padding: 8px 10px;
    font-size: 0.75rem;
  }

  .main-header {
    padding: 8px 12px;
  }

  .main-header h2 {
    font-size: 0.82rem;
    max-width: 68%;
  }

  .main-header span {
    font-size: 0.68rem;
  }

  .dots {
    bottom: 10px;
  }

  .dots span {
    width: 6px;
    height: 6px;
  }
}

@media (max-width: 400px) {
  .sidebar {
    max-height: 30vh;
  }

  .sidebar-header {
    font-size: 0.75rem;
  }

  .book-name {
    font-size: 0.68rem;
  }

  .book-title {
    font-size: 0.60rem;
  }

  .btn-home {
    font-size: 0.72rem;
    padding: 7px 9px;
  }
}
      .main-header {
        padding: 9px 12px;
      }

      .main-header h2 {
        font-size: 0.88rem;
        max-width: 65%;
      }

      .main-header span {
        font-size: 0.72rem;
      }

      .dots span {
        width: 7px;
        height: 7px;
      }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      📚 Orasi Ilmiah<br>
      Pengukuhan Profesor UNM<br>
      <small style="font-weight:400; opacity:0.85">Juli 2026</small>
    </div>

    <div class="book-list" id="bookList"></div>

    <div class="sidebar-footer">
      <button id="btnHome" class="btn-home">← Halaman Awal</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="main-header">
      <h2 id="currentTitle">Halaman Depan</h2>
      <span>Geser pojok halaman untuk membalik</span>
    </div>

    <div id="book-area">
      <!-- Slideshow -->
      <div class="slideshow" id="slideshow">
        <img src="kamis01.jpg" class="active" alt="Slide 1">
        <img src="kamis02.jpg" alt="Slide 2">
        <img src="kamis03.jpg" alt="Slide 3">
        <img src="kamis04.jpg" alt="Slide 4">
        <img src="kamis05.jpg" alt="Slide 5">
        <img src="kamis06.jpg" alt="Slide 6">
        <img src="kamis07.jpg" alt="Slide 7">
        <img src="kamis08.jpg" alt="Slide 8">
        <div class="dots" id="dots"></div>
      </div>

      <!-- Flipbook -->
      <div id="book"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/gh/SympleNZ/PDFlipbook@main/pdflipbook.js"></script>
  <script>
    const books = [
      { name: "1. Prof. Dr. SULTAN, S.Pd., M.Pd.", title: "Literasi Kritis di Era Infodemik", file: "sultan.pdf" },
      { name: "2. Prof. DR. KAMARUDDIN, S.Ag., M.Pd.", title: "Neuro-Semiotic Pedagogy di Era AI", file: "kamaruddin.pdf" },
      { name: "3. Prof.DR. ERMA SURYANI SAHABUDDIN, M.Si", title: "Ekopedagogi Digital & Generasi Berkelanjutan", file: "erma.pdf" },
      { name: "4. Prof. DR. WIDYA KARMILA SARI ACHMAD, S.Pd., M.Pd.", title: "Pedagogi Sosial Transformatif IPS SD", file: "widya.pdf" },
      { name: "5. Prof. Dr. MAEMUNA MUHAYYANG, S.Pd., M.Pd.", title: "Honorifik HI dalam Kesantunan Bugis", file: "maemuna.pdf" }
    ];

    let currentBook = null;
    let slideIndex = 0;
    let slideTimer = null;

    const bookListEl = document.getElementById('bookList');
    const currentTitleEl = document.getElementById('currentTitle');
    const slideshowEl = document.getElementById('slideshow');
    const slides = slideshowEl.querySelectorAll('img');
    const dotsEl = document.getElementById('dots');
    const bookEl = document.getElementById('book');

    // Buat dots
    slides.forEach((_, i) => {
      const dot = document.createElement('span');
      if (i === 0) dot.classList.add('active');
      dotsEl.appendChild(dot);
    });
    const dots = dotsEl.querySelectorAll('span');

    function showSlide(n) {
      slides.forEach(s => s.classList.remove('active'));
      dots.forEach(d => d.classList.remove('active'));
      slides[n].classList.add('active');
      dots[n].classList.add('active');
    }

    function nextSlide() {
      slideIndex = (slideIndex + 1) % slides.length;
      showSlide(slideIndex);
    }

    function startSlideshow() {
      clearInterval(slideTimer);
      slideTimer = setInterval(nextSlide, 4000);
    }

    function stopSlideshow() {
      clearInterval(slideTimer);
      slideshowEl.classList.add('hidden');
    }

    // Daftar buku
    books.forEach((book) => {
      const item = document.createElement('div');
      item.className = 'book-item';
      item.innerHTML = `
        <div class="book-name">${book.name}</div>
        <div class="book-title">${book.title}</div>
      `;
      item.addEventListener('click', () => {
        document.querySelectorAll('.book-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        loadBook(book);
      });
      bookListEl.appendChild(item);
    });

    function loadBook(book) {
      stopSlideshow();

      if (currentBook) {
        currentBook.destroy();
        currentBook = null;
      }

      bookEl.innerHTML = '';
      currentTitleEl.textContent = book.name;

      currentBook = PDFlipbook.create(bookEl, {
        url: book.file,
        duration: 550,
        cornerFold: true,
        displayMode: 'auto',
        controls: true,
        arrows: true,
        pageNumbers: true,
        zoomSteps: [1, 1.5, 2, 2.5],
        shadow: 'always'
      });
    }

    // Tombol Halaman Awal
    document.getElementById('btnHome').addEventListener('click', () => {
      if (currentBook) {
        currentBook.destroy();
        currentBook = null;
      }

      bookEl.innerHTML = '';
      document.querySelectorAll('.book-item').forEach(el => el.classList.remove('active'));

      slideshowEl.classList.remove('hidden');
      currentTitleEl.textContent = 'Halaman Depan';

      slideIndex = 0;
      showSlide(0);
      startSlideshow();
    });

    // Mulai slideshow
    startSlideshow();
  </script>
</body>
</html>
