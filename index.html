<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Orasi Ilmiah - Juli 2026 | UNM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --unm-gold: #C9A227;
      --unm-gold-dark: #9A7B1A;
      --unm-gold-light: #E8D48B;
      --bg-main: #2C2416;
      --sidebar-bg: #1F1A12;
    }

    body {
      background: #2C2416;
      min-height: 100vh;
      height: 100dvh;
      display: flex;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f0e6d0;
      overflow: hidden;
    }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: 300px;
      background: var(--sidebar-bg);
      border-right: 2px solid var(--unm-gold-dark);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 18px 16px;
      background: linear-gradient(145deg, #3A2F1C, #1F1A12);
      border-bottom: 2px solid var(--unm-gold-dark);
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.4;
      color: var(--unm-gold-light);
      flex-shrink: 0;
    }

    .book-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .book-item {
      padding: 11px 13px;
      margin-bottom: 7px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      background: rgba(201, 162, 39, 0.08);
    }

    .book-item:hover {
      background: rgba(201, 162, 39, 0.18);
      border-color: var(--unm-gold-dark);
    }

    .book-item.active {
      background: var(--unm-gold);
      border-color: var(--unm-gold-light);
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }

    .book-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--unm-gold-light);
      margin-bottom: 3px;
    }

    .book-title {
      font-size: 0.74rem;
      line-height: 1.3;
      opacity: 0.9;
      color: #e8d9b0;
    }

    .book-item.active .book-name,
    .book-item.active .book-title {
      color: #1F1A12;
    }

    .book-item.active .book-title { opacity: 0.85; }

    /* ========== MAIN ========== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
    }

    .main-header {
      padding: 12px 20px;
      background: #1F1A12;
      border-bottom: 2px solid var(--unm-gold-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--unm-gold-light);
      flex-shrink: 0;
      gap: 10px;
    }

    .main-header h2 {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main-header span {
      font-size: 0.8rem;
      opacity: 0.75;
      white-space: nowrap;
    }

    #book {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
      min-height: 0;

      --fb-bg: transparent;
      --fb-paper: #fffaf0;
      --fb-control-bg: rgba(31, 26, 18, 0.9);
      --fb-control-fg: #E8D48B;
      --fb-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
    }

    /* ========== SLIDESHOW ========== */
    .slideshow {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #1a1510;
      overflow: hidden;
    }

    .slideshow.hidden { display: none; }

    .slideshow img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;       /* gambar utuh, tidak terpotong */
      opacity: 0;
      transition: opacity 1s ease;
      background: #1a1510;
    }

    .slideshow img.active {
      opacity: 1;
      z-index: 1;
    }

    /* indikator titik */
    .dots {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 5;
    }

    .dots span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      transition: background 0.3s;
    }

    .dots span.active {
      background: var(--unm-gold);
    }

    /* ========== ANDROID / MOBILE ========== */
    @media (max-width: 768px) {
      body { flex-direction: column; height: 100dvh; }

      .sidebar {
        width: 100%;
        height: auto;
        max-height: 36vh;
        border-right: none;
        border-bottom: 2px solid var(--unm-gold-dark);
      }

      .sidebar-header { padding: 11px 14px; font-size: 0.9rem; }
      .book-list { padding: 8px 10px; }
      .book-item { padding: 9px 11px; margin-bottom: 5px; }
      .book-name { font-size: 0.78rem; }
      .book-title { font-size: 0.70rem; }

      .main-header { padding: 9px 12px; }
      .main-header h2 { font-size: 0.88rem; max-width: 65%; }
      .main-header span { font-size: 0.72rem; }

      .dots { bottom: 10px; }
      .dots span { width: 7px; height: 7px; }
    }

    @media (max-width: 400px) {
      .sidebar { max-height: 34vh; }
      .book-name { font-size: 0.74rem; }
      .book-title { font-size: 0.66rem; }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      📚 Orasi Ilmiah<br>
      Pengukuhan Profesor UNM<br>
      <small style="font-weight:400; opacity:0.85">Juli 2026</small>
    </div>
    <div class="book-list" id="bookList"></div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="main-header">
      <h2 id="currentTitle">Selamat Datang</h2>
      <span>Geser pojok halaman untuk membalik</span>
    </div>

    <div id="book">
      <!-- SLIDESHOW -->
      <div class="slideshow" id="slideshow">
        <img src="kamis01.jpg" alt="Slide 1" class="active">
        <img src="kamis02.jpg" alt="Slide 2">
        <img src="kamis03.jpg" alt="Slide 3">
        <img src="kamis04.jpg" alt="Slide 4">
        <img src="kamis05.jpg" alt="Slide 5">
        <img src="kamis06.jpg" alt="Slide 6">
        <img src="kamis07.jpg" alt="Slide 7">
        <img src="kamis08.jpg" alt="Slide 8">
        <div class="dots" id="dots"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/gh/SympleNZ/PDFlipbook@main/pdflipbook.js"></script>
  <script>
    // ===== DATA 5 NASKAH =====
    const books = [
      { name: "1. Prof. Dr. SULTAN, S.Pd., M.Pd.", title: "Literasi Kritis di Era Infodemik", file: "sultan.pdf" },
      { name: "2. Prof. DR. KAMARUDDIN, S.Ag., M.Pd.", title: "Neuro-Semiotic Pedagogy di Era AI", file: "kamaruddin.pdf" },
      { name: "3. Prof.DR. ERMA SURYANI SAHABUDDIN, M.Si", title: "Ekopedagogi Digital & Generasi Berkelanjutan", file: "erma.pdf" },
      { name: "4. Prof. DR. WIDYA KARMILA SARI ACHMAD, S.Pd., M.Pd.", title: "Pedagogi Sosial Transformatif IPS SD", file: "widya.pdf" },
      { name: "5. Prof. Dr. MAEMUNA MUHAYYANG, S.Pd., M.Pd.", title: "Honorifik HI dalam Kesantunan Bugis", file: "maemuna.pdf" }
    ];

    let currentBook = null;
    let slideIndex = 0;
    let slideTimer = null;

    const bookListEl = document.getElementById('bookList');
    const currentTitleEl = document.getElementById('currentTitle');
    const slideshowEl = document.getElementById('slideshow');
    const slides = slideshowEl.querySelectorAll('img');
    const dotsEl = document.getElementById('dots');

    // Buat indikator titik
    slides.forEach((_, i) => {
      const dot = document.createElement('span');
      if (i === 0) dot.classList.add('active');
      dotsEl.appendChild(dot);
    });
    const dots = dotsEl.querySelectorAll('span');

    // Fungsi ganti slide
    function showSlide(n) {
      slides.forEach(s => s.classList.remove('active'));
      dots.forEach(d => d.classList.remove('active'));
      slides[n].classList.add('active');
      dots[n].classList.add('active');
    }

    function nextSlide() {
      slideIndex = (slideIndex + 1) % slides.length;  // loop ke slide 1
      showSlide(slideIndex);
    }

    // Mulai slideshow (ganti setiap 4 detik)
    function startSlideshow() {
      slideTimer = setInterval(nextSlide, 4000);
    }

    function stopSlideshow() {
      clearInterval(slideTimer);
      slideshowEl.classList.add('hidden');
    }

    // Buat daftar buku
    books.forEach((book, index) => {
      const item = document.createElement('div');
      item.className = 'book-item';
      item.innerHTML = `
        <div class="book-name">${book.name}</div>
        <div class="book-title">${book.title}</div>
      `;

      item.addEventListener('click', () => {
        document.querySelectorAll('.book-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        loadBook(book);
      });

      bookListEl.appendChild(item);
    });

    function loadBook(book) {
      stopSlideshow();

      if (currentBook) {
        currentBook.destroy();
        currentBook = null;
      }

      currentTitleEl.textContent = book.name;

      currentBook = PDFlipbook.create(document.getElementById('book'), {
        url: book.file,
        duration: 550,
        cornerFold: true,
        displayMode: 'auto',
        controls: true,
        arrows: true,
        pageNumbers: true,
        zoomSteps: [1, 1.5, 2, 2.5],
        shadow: 'always'
      });
    }

    // Jalankan slideshow saat halaman dibuka
    startSlideshow();
  </script>
</body>
</html>
